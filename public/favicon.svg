<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- 0x6D62 = "mb": the 16 bits on a 4x4 grid (rows: 0110 1101 0110 0010) -->
  <rect width="64" height="64" rx="14" fill="#08090a" shape-rendering="geometricPrecision"/>
  <g fill="#ff7a1a">
    <rect x="20" y="8" width="24" height="12"/>
    <rect x="8" y="20" width="24" height="12"/>
    <rect x="44" y="20" width="12" height="12"/>
    <rect x="20" y="32" width="24" height="12"/>
    <rect x="32" y="44" width="12" height="12"/>
  </g>
</svg>
